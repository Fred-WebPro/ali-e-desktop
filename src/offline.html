<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Нет связи</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0f1013; color: #e8e8ea;
    font-family: "Segoe UI", system-ui, sans-serif; text-align: center; padding: 24px;
  }
  .box { max-width: 460px; }
  .mark {
    width: 64px; height: 64px; margin: 0 auto 22px; border-radius: 18px;
    background: #17171b; border: 1px solid #2a2a31;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 22px; letter-spacing: .5px;
    background-image: radial-gradient(circle at 50% 130%, rgba(249,115,22,.35), transparent 70%);
  }
  .mark span { color: #f97316; }
  h1 { font-size: 21px; margin: 0 0 10px; font-weight: 800; }
  p { margin: 0 0 8px; color: #9a9aa2; font-size: 14px; line-height: 1.55; }
  .reason { color: #6a6a72; font-size: 12px; margin-top: 14px; }
  button {
    margin-top: 26px; padding: 11px 26px; border-radius: 11px; border: 0; cursor: pointer;
    background: #f97316; color: #fff; font-weight: 700; font-size: 14px;
    font-family: inherit; transition: filter .15s;
  }
  button:hover { filter: brightness(1.1); }
</style>
</head>
<body>
  <div class="box">
    <div class="mark">A<span>E</span></div>
    <h1>Не удалось связаться с сервером</h1>
    <p>Приложению нужен интернет: все данные хранятся в облаке и приходят в реальном времени.</p>
    <p>Проверьте подключение и повторите попытку.</p>
    <button onclick="location.href='https://app.aliecrm.com'">Повторить</button>
    <div class="reason">{{REASON}}</div>
  </div>
</body>
</html>
